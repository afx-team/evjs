name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
          cache: npm

      - name: Setup npm
        run: npm install --global npm@11.19.0

      - name: Install Dependencies
        run: npm ci

      - name: Build Core Packages
        run: npx turbo build --filter="./packages/*"

      - name: Build Examples and Docs
        run: npx turbo build --filter="./examples/*" --filter="evjs-docs" --concurrency=2

      - name: Lint & Type Check
        run: npm run lint && npm run check-types

      - name: Run Unit Tests
        run: npm test

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests
        run: npm run test:e2e

      - name: Upload Playwright Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() && hashFiles('e2e/playwright-report/**') != '' }}
        with:
          name: playwright-report
          path: e2e/playwright-report/
          if-no-files-found: error
          retention-days: 7
